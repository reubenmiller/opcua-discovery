[package]
name = "opcua-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Production-grade CLI for efficiently scanning and discovering an OPC UA namespace."
license = "Apache-2.0"
repository = "https://github.com/thin-edge/opcua-discovery"
readme = "README.md"
keywords = ["opcua", "iiot", "industrial", "discovery", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "opcua-scan"
path = "src/main.rs"

[dependencies]
async-opcua = { version = "0.18", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
csv = "1.3"

globset = "0.4"
regex = "1.10"
fuzzy-matcher = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.17"

thiserror = "1"
anyhow = "1"
humantime = "2"
dirs = "5"
rpassword = "7"

# Interactive TUI (used only when --tui is passed)
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
async-opcua = { version = "0.18", default-features = false, features = ["client", "server"] }
tempfile = "3"
# Parametrized / table-driven tests for readable, low-duplication suites.
rstest = "0.23"
# Property-based testing for pure logic (filters, value conversion).
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
